name: probe-fielding

# Looks for per-play catch probability on Baseball Savant; commits probe/fielding_report.md.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to check"
        default: "2025"
        required: true
      player:
        description: "MLBAM player id"
        default: "691718"
        required: true
      slug:
        description: "Savant name slug"
        default: "pete-crow-armstrong"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/probe_fielding.py "${{ inputs.season }}" "${{ inputs.player }}" "${{ inputs.slug }}"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/
          git commit -m "Fielding probe for ${{ inputs.season }}" || echo "No changes"
          git push
