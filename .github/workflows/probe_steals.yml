name: probe-steals

# Looks for stolen-base timing data on Baseball Savant; commits probe/steals_report.md.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to check"
        default: "2025"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python src/probe_steals.py "${{ inputs.season }}"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/
          git commit -m "Steal-timing probe for ${{ inputs.season }}" || echo "No changes"
          git pull --rebase origin main && git push
