name: pipeline

# Runs a whole season end to end: pull -> build -> credit -> external checks + site export.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (YYYY)"
        required: true
      skip_pull:
        description: "Reuse the raw data already in the release (rebuild only)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: pipeline-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  pull:
    if: ${{ !inputs.skip_pull }}
    uses: ./.github/workflows/pull_season.yml
    with: { season: "${{ inputs.season }}" }
  build:
    needs: pull
    if: ${{ always() && (needs.pull.result == 'success' || needs.pull.result == 'skipped') }}
    uses: ./.github/workflows/build_season.yml
    with: { season: "${{ inputs.season }}" }
  credit:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    uses: ./.github/workflows/credit_season.yml
    with: { season: "${{ inputs.season }}" }
  external:
    needs: credit
    if: ${{ always() && needs.credit.result == 'success' }}
    uses: ./.github/workflows/external_checks.yml
    with: { season: "${{ inputs.season }}" }
  export:
    needs: credit
    if: ${{ always() && needs.credit.result == 'success' }}
    uses: ./.github/workflows/export_season.yml
    with: { season: "${{ inputs.season }}" }
